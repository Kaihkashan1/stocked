<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="_ds/organic-235e2d3f-6423-4975-9805-e3e26a8eb65b/styles.css">
<script src="_ds/organic-235e2d3f-6423-4975-9805-e3e26a8eb65b/_ds_bundle.js"></script>
</helmet>
<div style="width:{{ box }};height:{{ box }};position:relative;flex:none">
  <div style="position:absolute;top:0;left:0;width:168px;height:168px;transform:scale({{ k }});transform-origin:top left;border-radius:{{ radius }};overflow:hidden;background:var(--color-bg)">
    <div style="position:absolute;left:56px;top:18px;width:11px;height:28px;border-radius:999px;background:var(--color-accent-2-400);transform:rotate(-15deg)"></div>
    <div style="position:absolute;left:78px;top:12px;width:11px;height:38px;border-radius:999px;background:var(--color-accent-2-500);transform:rotate(12deg)"></div>
    <div style="position:absolute;left:112px;bottom:76px;width:11px;height:70px;border-radius:999px;background:var(--color-accent-2-600);transform:rotate(30deg)"></div>
    <div style="position:absolute;left:122px;bottom:130px;width:26px;height:21px;border-radius:50%;background:var(--color-accent-2-600);transform:rotate(30deg)"></div>
    <div style="position:absolute;left:62px;bottom:28px;width:44px;height:15px;border-radius:999px;background:var(--color-accent-600)"></div>
    <div style="position:absolute;left:24px;bottom:44px;width:120px;height:60px;border-radius:0 0 999px 999px;background:var(--color-accent)"></div>
    <div style="position:absolute;left:17px;bottom:98px;width:134px;height:14px;border-radius:999px;background:var(--color-accent-600)"></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:1024},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1024,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:40,&quot;max&quot;:1024,&quot;unit&quot;:&quot;px&quot;},&quot;square&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 1024);
    return { box: size + 'px', k: size / 168, radius: this.props.square ? '0px' : '38px' };
  }
}

</script>
</body>
</html>

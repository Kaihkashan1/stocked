<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <p class="eyebrow">Personal collection</p>
        <h1>Recipe Box</h1>
      </div>
      <nav class="tabs" aria-label="Sections">
        <button class="tab active" type="button" data-tab="recipes">Recipes</button>
        <button class="tab" type="button" data-tab="plan">Plan<span id="plan-badge" class="tab-badge" hidden>0</span></button>
      </nav>
      <button id="add-recipe-btn" class="icon-round" type="button" aria-label="Add recipe">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="settings-btn" class="icon-round" type="button" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.8 1.8 0 0 0 .36 1.98l.06.06a2.16 2.16 0 1 1-3.06 3.06l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.09 1.65v.17a2.16 2.16 0 1 1-4.32 0v-.09a1.8 1.8 0 0 0-1.18-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06a2.16 2.16 0 1 1-3.06-3.06l.06-.06a1.8 1.8 0 0 0 .36-1.98 1.8 1.8 0 0 0-1.65-1.09h-.17a2.16 2.16 0 1 1 0-4.32h.09a1.8 1.8 0 0 0 1.65-1.18 1.8 1.8 0 0 0-.36-1.98l-.06-.06a2.16 2.16 0 1 1 3.06-3.06l.06.06a1.8 1.8 0 0 0 1.98.36h.08a1.8 1.8 0 0 0 1.09-1.65v-.17a2.16 2.16 0 1 1 4.32 0v.09a1.8 1.8 0 0 0 1.09 1.65h.08a1.8 1.8 0 0 0 1.98-.36l.06-.06a2.16 2.16 0 1 1 3.06 3.06l-.06.06a1.8 1.8 0 0 0-.36 1.98v.08a1.8 1.8 0 0 0 1.65 1.09h.17a2.16 2.16 0 1 1 0 4.32h-.09a1.8 1.8 0 0 0-1.65 1.09z"/></svg>
      </button>
    </div>
    <div class="search-row">
      <label class="search">
        <span class="visually-hidden">Search recipes</span>
        <input id="search" type="search" placeholder="Search title, ingredient, tag…">
      </label>
      <div class="filters-anchor">
        <button id="filters-btn" class="filters-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters
        </button>
        <div id="filters-panel" class="filters-panel" hidden>
          <section>
            <h2 class="eyebrow">Meal</h2>
            <div id="meal-filters" class="chips"></div>
          </section>
          <section>
            <h2 class="eyebrow">Cuisine</h2>
            <div id="cuisine-filters" class="chips"></div>
          </section>
          <section>
            <h2 class="eyebrow">Tag</h2>
            <div id="tag-filters" class="chips"></div>
          </section>
          <section>
            <button id="favorites-toggle" class="favorites-toggle" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3.6c-2-2.3-5.4-2.6-7.5-.4-2.2 2.2-2.1 5.8.3 8.1L12 18.6l7.2-7.3c2.4-2.3 2.5-5.9.3-8.1-2.1-2.2-5.5-1.9-7.5.4z"/></svg>
              Favorites only
            </button>
          </section>
          <section>
            <h2 class="eyebrow">Sort</h2>
            <div id="sort-options" class="chips">
              <button class="chip active" type="button" data-sort="recent">Recent</button>
              <button class="chip" type="button" data-sort="az">A–Z</button>
              <button class="chip" type="button" data-sort="za">Z–A</button>
            </div>
          </section>
          <button id="filters-reset" class="link-btn" type="button">Reset filters</button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell" id="recipes-view">
    <aside class="filters" aria-label="What I have">
      <section>
        <h2 class="eyebrow">What I have</h2>
        <input id="pantry-search" class="pantry-search" type="search" placeholder="Find an ingredient…">
        <div id="pantry-selected"></div>
        <div id="pantry-options" class="pantry-options"></div>
      </section>
    </aside>

    <main>
      <p id="status" class="status"></p>
      <div id="grid" class="grid"></div>
    </main>
  </div>

  <div class="shell plan-shell" id="plan-view" hidden>
    <div id="plan-content" class="plan-content"></div>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
      <article id="recipe-detail"></article>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
